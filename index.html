<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Расписание Softly.fit</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#292929;background:#fff;--pink:#E973B6;--green:#B8D05E}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff}.wrap{width:100%;margin:auto;padding:20px 18px}.wrap:has(#choose:not(.hidden)){max-width:800px;padding-top:45px}.wrap:has(#details:not(.hidden)){max-width:100%;padding:16px 18px}#choose{background:#fff;border:3px solid var(--green);border-radius:28px;padding:30px;box-shadow:0 12px 38px rgba(233,115,182,.10)}h1{font-size:clamp(25px,3vw,35px);margin:0 0 12px;letter-spacing:-.6px}p{line-height:1.5;margin:0;color:#555}.eyebrow{color:#9a3e75;letter-spacing:.13em;font-size:12px;font-weight:800;margin-bottom:12px}.grid{display:grid;gap:12px;margin-top:26px}.branch{width:100%;text-align:left;border:2px solid transparent;background:var(--green);border-radius:18px;padding:19px 21px;font-size:16px;font-weight:750;color:#222;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:transform .2s,background .2s}.branch:nth-child(even){background:var(--pink);color:#fff}.branch:hover{transform:translateY(-2px);filter:brightness(1.02)}.branch small{display:block;margin-top:5px;font-size:13px;font-weight:500;opacity:.82}.branch:after{content:'↗';font-size:23px}.back{border:0;background:var(--green);color:#222;border-radius:14px;padding:13px 19px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:17px}.back:hover{background:#a9c54c}#details h1{margin:0 0 17px;color:#292929}#schedule{width:100%;min-height:70vh;overflow-x:auto;background:#fff;border:2px solid var(--green);border-radius:18px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.04)}lk-schedule{display:block;width:100%;min-height:70vh}.hidden{display:none}@media(max-width:700px){.wrap:has(#choose:not(.hidden)){padding:16px 10px}.wrap:has(#details:not(.hidden)){padding:10px 5px}#choose{padding:24px 14px;border-radius:22px}.branch{padding:17px}#schedule{padding:3px;border-radius:10px}h1{font-size:24px}}
</style></head><body>
<main class="wrap"><section id="choose"><div class="eyebrow">SOFTLY.FIT · С ЗАБОТОЙ О ТЕБЕ</div><h1>Расписание Softly.fit 🤍</h1><p>Выберите студию, чтобы посмотреть тренировки и записаться.</p><div class="grid" id="branches"></div></section><section id="details" class="hidden"><button class="back" id="back" type="button">← Все филиалы</button><h1 id="branchTitle"></h1><div id="schedule"></div></section></main>
<script>
const branches=[{name:'Петровский бульвар, 7',area:'Мурино',club:1},{name:'Ручьёвский проспект, 15',area:'Мурино',club:3},{name:'Дальневосточный проспект, 33к1',area:'Дыбенко',club:2},{name:'Проспект Художников, 10к1',area:'Озерки',club:4},{name:'Европейский проспект, 18к2',area:'Кудрово',club:5}];
const choose=document.getElementById('choose'),details=document.getElementById('details'),schedule=document.getElementById('schedule');
let loaded=false;
function showBranch(b){choose.classList.add('hidden');details.classList.remove('hidden');document.getElementById('branchTitle').textContent=b.name; schedule.replaceChildren();const widget=document.createElement('lk-schedule');widget.setAttribute('theme','light');widget.setAttribute('domain','https://softly.fitbase.io/');widget.setAttribute('data-subdomain','softly');widget.setAttribute('data-club',String(b.club));schedule.append(widget);if(!loaded){loaded=true;const s=document.createElement('script');s.src='https://softly.fitbase.io/vue-resources/personal-account/dist/schedule-init.js';s.defer=true;document.body.append(s)}window.scrollTo(0,0)}
function showChoose(){schedule.replaceChildren();details.classList.add('hidden');choose.classList.remove('hidden');window.scrollTo(0,0)}
for(const b of branches){const btn=document.createElement('button');btn.className='branch';btn.type='button';btn.textContent=b.name;const sub=document.createElement('small');sub.textContent=b.area;btn.append(sub);btn.addEventListener('click',()=>showBranch(b));document.getElementById('branches').append(btn)}document.getElementById('back').addEventListener('click',showChoose);
</script></body></html>
