<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание Softly.fit</title>
<style>
:root{--pink:#ee65b6;--green:#b9df58;--ink:#292a30}*{box-sizing:border-box}body{margin:0;background:#fffafd;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{width:min(1320px,calc(100% - 24px));margin:12px auto;padding:18px 22px 20px;background:#fff;border:5px solid var(--green);border-radius:28px;box-shadow:0 10px 28px #e8bdd51a}.eyebrow{font-weight:800;color:#ec159b;letter-spacing:2px;font-size:12px;margin:0 0 12px}.heading{position:relative;overflow:hidden;width:100%;min-height:84px;border-radius:20px;display:flex;align-items:center;padding:14px 26px;background:linear-gradient(115deg,#c5e784,#b7dc5e 58%,#d4eb9c)}.heading h1{position:relative;z-index:1;font-size:clamp(24px,3vw,35px);line-height:1.15;margin:0;letter-spacing:-.7px}.heart{font-size:.82em}.heading:before,.heading:after{content:"";position:absolute;pointer-events:none;border-radius:50%}.heading:before{width:160px;height:160px;background:#ffffff40;left:40%;top:-110px}.heading:after{width:180px;height:180px;border:2px solid #ffffffb8;right:17%;bottom:-150px}.heading .bubble{position:absolute;width:120px;height:120px;border-radius:50%;background:#ffffff52;right:-24px;top:-50px}.heading .smallbubble{position:absolute;width:30px;height:30px;border-radius:50%;border:2px solid #fff;right:22%;top:16px}.intro{font-size:16px;margin:14px 0 16px}.locations{display:grid;gap:10px}.location{position:relative;isolation:isolate;overflow:hidden;min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px;border:0;border-radius:20px;padding:14px 24px;color:white;background:linear-gradient(100deg,#f078c1,#ee62b5 65%,#ef7bc2);font-size:clamp(16px,1.7vw,21px);font-weight:800;text-align:left;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}.location:hover{transform:translateY(-2px);filter:brightness(1.035)}.location:focus-visible,.back:focus-visible{outline:3px solid #91b733;outline-offset:3px}.location span{position:relative;z-index:2}.arrow{font-size:28px;font-weight:400}.location:before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:#ffd4ed5c;left:-75px;top:-45px}.location:after{content:"";position:absolute;width:160px;height:160px;border:2px solid #ffe1f3a6;border-radius:50%;right:10%;bottom:-132px}.location:nth-child(2):after{right:-60px;bottom:-65px;background:#ffceeb45;border:0}.location:nth-child(3):before{left:auto;right:-70px;top:-80px}.location:nth-child(4):after{right:16%;bottom:-120px;background:#ffd4ed55;border:0}.location:nth-child(5):after{right:8%;bottom:-130px}.schedule-screen{display:none}.schedule-screen.active{display:block}.chooser.hidden{display:none}.back{background:#fff;color:#d72389;border:0;border-radius:24px;padding:11px 17px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:12px}.schedule-panel{padding:14px;border-radius:22px;background:linear-gradient(135deg,#c8e98b,#b9df58);position:relative;overflow:hidden}.schedule-panel h2{margin:0 0 12px;font-size:clamp(19px,2.5vw,27px)}.schedule-frame{background:#fff;border-radius:15px;padding:6px;min-height:600px;overflow-x:auto}.schedule-frame lk-schedule{display:block;width:100%;min-width:860px;min-height:600px}.schedule-link{display:inline-block;margin-top:12px;color:#273016;font-weight:700}.note{font-size:13px;color:#626262;margin:14px 0 0}@media(max-width:700px){.shell{width:calc(100% - 12px);margin:6px auto;padding:12px 10px;border-width:3px;border-radius:20px}.eyebrow{font-size:10px;letter-spacing:1.3px;margin-bottom:9px}.heading{min-height:70px;padding:12px 15px;border-radius:15px}.heading h1{font-size:clamp(21px,5vw,29px);letter-spacing:-.4px}.intro{font-size:14px;line-height:1.4;margin:12px 0 14px}.locations{gap:8px}.location{min-height:64px;padding:12px 14px;border-radius:15px;font-size:clamp(14px,3.5vw,17px)}.arrow{font-size:23px}.schedule-panel{padding:8px;border-radius:15px}.schedule-frame{padding:4px}.schedule-frame lk-schedule{min-width:760px}.back{font-size:13px}}
</style>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
<main class="shell">
 <p class="eyebrow">SOFTLY.FIT · С ЗАБОТОЙ О ТЕБЕ</p>
 <section id="chooser" class="chooser">
  <header class="heading"><span class="bubble"></span><span class="smallbubble"></span><h1>Расписание Softly.fit <span class="heart">🤍</span></h1></header>
  <p class="intro">Выберите студию, чтобы посмотреть тренировки и записаться.</p>
  <nav class="locations" aria-label="Выбор филиала">
   <button class="location" data-club="1"><span>Петровский бульвар, 7, Мурино</span><span class="arrow">↗</span></button>
   <button class="location" data-club="3"><span>Ручьёвский проспект, 15, Мурино</span><span class="arrow">↗</span></button>
   <button class="location" data-club="2"><span>Дальневосточный проспект, 33к1, Дыбенко</span><span class="arrow">↗</span></button>
   <button class="location" data-club="4"><span>Проспект Художников, 10к1, Озерки</span><span class="arrow">↗</span></button>
   <button class="location" data-club="5"><span>Европейский проспект, 18к2, Кудрово</span><span class="arrow">↗</span></button>
  </nav>
 </section>
 <section id="scheduleScreen" class="schedule-screen" aria-label="Расписание выбранной студии">
  <div class="schedule-panel">
   <button id="back" class="back" type="button">← Все филиалы</button>
   <h2 id="branchTitle"></h2>
   <div id="scheduleFrame" class="schedule-frame"></div>
   <a id="directLink" class="schedule-link" target="_blank" rel="noopener noreferrer">Открыть расписание отдельно ↗</a>
  </div>
 </section>
</main>
<script>
// Сообщаем ВКонтакте, что страница приложения готова.
if (window.vkBridge && typeof window.vkBridge.send === 'function') {
  window.vkBridge.send('VKWebAppInit').catch(function(error){console.warn('VK Bridge:',error)});
}
const clubs={1:'Петровский бульвар, 7, Мурино',3:'Ручьёвский проспект, 15, Мурино',2:'Дальневосточный проспект, 33к1, Дыбенко',4:'Проспект Художников, 10к1, Озерки',5:'Европейский проспект, 18к2, Кудрово'};
const chooser=document.getElementById('chooser'),screen=document.getElementById('scheduleScreen'),frame=document.getElementById('scheduleFrame');
function showClub(id){if(!clubs[id])return;chooser.classList.add('hidden');screen.classList.add('active');document.getElementById('branchTitle').textContent=clubs[id];document.getElementById('directLink').href='https://softly.fitbase.io/lk/schedule?club='+id;frame.innerHTML='';const el=document.createElement('lk-schedule');el.setAttribute('theme','light');el.setAttribute('domain','https://softly.fitbase.io/');el.setAttribute('data-subdomain','softly');el.setAttribute('data-club',id);frame.appendChild(el);const s=document.createElement('script');s.src='https://softly.fitbase.io/vue-resources/personal-account/dist/schedule-init.js';s.defer=true;frame.appendChild(s);history.replaceState(null,'','#club='+id);window.scrollTo(0,0)}
function goBack(){screen.classList.remove('active');chooser.classList.remove('hidden');frame.innerHTML='';history.replaceState(null,'',location.pathname+location.search);window.scrollTo(0,0)}
document.querySelectorAll('[data-club]').forEach(b=>b.addEventListener('click',()=>showClub(b.dataset.club)));document.getElementById('back').addEventListener('click',goBack);const id=location.hash.match(/^#club=(\d+)$/)?.[1];if(id&&clubs[id])showClub(id);
</script>
</body>
</html>
